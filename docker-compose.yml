version: "3.3"
services:
  db: # barmi lehet
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_DATABASE: "dutch_pub"
      MYSQL_USER: "test"
      MYSQL_PASSWORD: "test"
      MYSQL_ROOT_PASSWORD: "test"
    ports:
      - "3307:3306"
    expose:
      - "3307"
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_PORT: 3306
      DB_HOST: db
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: dutch_pub
      # BASE_URL: https://dutch-card-oxthkdwy2a-oa.a.run.app
      FRONTEND_ROOT: /usr/src/app/build
    ports:
      - "3030:3030"
