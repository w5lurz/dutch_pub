version: "3.3"
services:
  db: # barmi lehet
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_DATABASE: "dutch_pub"
      # So you don't have to use root, but you can if you like
      MYSQL_USER: "test"
      # You can use whatever password you like
      MYSQL_PASSWORD: "test"
      # Password for root access
      MYSQL_ROOT_PASSWORD: "test"
    ports:
      # <Port exposed> : <MySQL Port running inside container>
      - "3307:3306"
    expose:
      # Opens port 3306 on the container
      - "3307"
      # Where our data will be persisted
    #volumes: #
    # - my-db:/var/lib/mysql
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Secrets (COOKIE_SECRET, JWT_SECRET, ...) come from backend/.env;
    # values under `environment` below take precedence over it.
    env_file:
      - backend/.env
    environment:
      DB_PORT: 3306
      DB_HOST: db
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: dutch_pub
      # BASE_URL: https://dutch-card-oxthkdwy2a-oa.a.run.app
      FRONTEND_ROOT: /usr/src/app/build
    ports:
      - "3030:3030"
